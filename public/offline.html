<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hors ligne — Purama AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(ellipse at top, #1a0a2e 0%, #0A0A0F 60%);
      color: #F8FAFC;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%; text-align: center;
      padding: 32px; border-radius: 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; }
    p { font-size: 14px; color: rgba(248,250,252,0.6); margin: 0 0 24px; line-height: 1.5; }
    button {
      background: linear-gradient(135deg, #8B5CF6, #06B6D4);
      color: white; border: none; padding: 12px 24px;
      border-radius: 12px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: transform 0.2s;
    }
    button:hover { transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Tu es hors ligne</h1>
    <p>Vérifie ta connexion. Tes agents continuent de tourner sur nos serveurs en arrière-plan — tu retrouveras tout dès que tu seras de nouveau en ligne.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
