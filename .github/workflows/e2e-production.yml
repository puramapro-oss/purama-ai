name: Production E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-e2e
  cancel-in-progress: false

jobs:
  docuseal:
    name: DocuSeal production E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run DocuSeal E2E
        run: npx playwright test --config playwright.docuseal.config.ts
        env:
          SUPABASE_URL: https://auth.purama.dev
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DOCUSEAL_API_TOKEN: ${{ secrets.DOCUSEAL_API_TOKEN }}
          CLEANUP: "true"

  karta:
    name: KARTA production E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run KARTA E2E
        run: npx playwright test --config playwright.karta.config.ts
        env:
          SUPABASE_URL: https://auth.purama.dev
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
