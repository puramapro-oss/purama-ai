name: Production E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-e2e
  cancel-in-progress: false

jobs:
  docuseal:
    name: DocuSeal production E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-e2e
    env:
      SUPABASE_URL: https://auth.purama.dev
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DOCUSEAL_API_TOKEN: ${{ secrets.DOCUSEAL_API_TOKEN }}
      CLEANUP: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run DocuSeal E2E
        run: npx playwright test --config playwright.docuseal.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-docuseal
          path: playwright-report-docuseal/
          retention-days: 7

  karta:
    name: KARTA production E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-e2e
    env:
      SUPABASE_URL: https://auth.purama.dev
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run KARTA E2E
        run: npx playwright test --config playwright.karta.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-karta
          path: playwright-report-karta/
          retention-days: 7
