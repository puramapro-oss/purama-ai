name: KARTA IAO identity

on:
  pull_request:
  push:
    branches:
      - codex/t03-iao-local-transport-20261014

permissions:
  contents: read

jobs:
  karta-iao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: karta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: karta/package-lock.json
      - name: Install KARTA
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit --incremental false --pretty false -p tsconfig.json
      - name: Full KARTA tests (identity, facade, health and local transport)
        run: npm test
