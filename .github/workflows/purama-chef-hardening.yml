name: PURAMA CHEF hardening

on:
  push:
    branches:
      - main
      - codex/purama-chef-hardening-20260927
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purama-chef-${{ github.ref }}
  cancel-in-progress: true

jobs:
  karta:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: karta
    steps:
      - uses: actions/checkout@v4
      - name: Approval outbox wrapper lifecycle (inert)
        run: >-
          python3 ../qa/approval-outbox-live-20261111/test_wrapper_lifecycle.py
          --evidence "$RUNNER_TEMP/karta-outbox-wrapper-tests.json"
      - name: Preserve outbox wrapper lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: karta-outbox-wrapper-lifecycle
          path: ${{ runner.temp }}/karta-outbox-wrapper-tests.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: karta/package-lock.json
      - run: npm ci --no-audit
      - run: node ../scripts/generate-supabase-contracts.mjs --check
      - run: npm test
      - run: node --test ../tests/oauth-google/state-sql.test.mjs
      - name: OAuth state on native PostgreSQL
        working-directory: .
        run: >-
          bash qa/reliability-audit-20261110/oauth-native/run-native.sh
          --migration supabase/migrations/20261110233000_oauth_connection_states.sql
          --helper supabase/functions/_shared/oauth-state.ts
          --fixture-root "$RUNNER_TEMP/purama-oauth-native-clusters"
          --output "$RUNNER_TEMP/purama-oauth-native-results"
      - name: Preserve native OAuth evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oauth-native-results
          path: ${{ runner.temp }}/purama-oauth-native-results
      - run: npm run typecheck
      - run: npm run build
      - name: Stripe reconciliation SQL invariants
        working-directory: .
        env:
          PGLITE_MODULE: ${{ github.workspace }}/karta/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test --test-concurrency=1 --test-timeout=30000 tests/revenue/inbox-sql.test.mjs
      - name: Social publication and account binding SQL invariants
        working-directory: .
        env:
          PGLITE_MODULE: ${{ github.workspace }}/karta/node_modules/@electric-sql/pglite/dist/index.js
        run: >-
          node --test --test-concurrency=1 --test-timeout=30000
          tests/social-publish/migration-sql.test.mjs
          tests/social-connection/binding-sql.test.mjs
      - if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        run: npm audit --audit-level=high --omit=dev

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm ci --no-audit
      - run: npm run test:dependencies
      - name: Entraide public transport and account isolation
        run: >-
          node --test --test-concurrency=1 --test-timeout=30000
          tests/entraide/frontend.test.mjs tests/entraide/ui-account-scope.test.mjs
      - run: npm run lint
      - run: npm run test:distribution:unit
      - run: npm run test:distribution:sql
      - run: npm run test:distribution:worker
      - run: npm run test:distribution:chat
      - run: npm run test:contracts-auth
      - run: npm run test:cross-app-jwt
      - run: npm run test:cross-app-jwt:deno
      - run: npm run test:voice-settings
      - run: npm run test:contracts-security
      - run: npm run test:contracts-ots
      - run: npm run test:contracts-native
      - run: npm run test:oauth
      - run: deno check --no-config --no-lock --node-modules-dir=manual supabase/functions/contracts-ots-stamp/index.ts supabase/functions/contracts-ots-verify/index.ts supabase/functions/contracts-webhook/index.ts supabase/functions/check-subscription/index.ts supabase/functions/process-influencer-payments/index.ts supabase/functions/founder-dashboard/index.ts supabase/functions/agent-chat/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/oauth-google/index.ts supabase/functions/email-agent-gmail-oauth/index.ts supabase/functions/creator-agent-chat/index.ts supabase/functions/create-checkout/index.ts supabase/functions/customer-portal/index.ts
      - run: npm run test:commerce:plans
      - run: npm run test:commerce:handlers
      - name: Social publication core behavior
        run: >-
          deno test --no-config --no-lock --no-prompt --deny-net --deny-run
          tests/social-publish/client-intent.test.ts
          tests/social-publish/provider.test.ts
          tests/social-publish/publish.test.ts
          tests/social-publish/scheduled.test.ts
          tests/social-connection/connection.test.ts
          tests/social-management/handlers.test.ts
      - name: Agent execution lifetime isolation
        run: node --test --test-concurrency=1 --test-timeout=30000 tests/social-agent-execution.test.mjs
      - name: Social routes with the real Supabase SDK
        run: >-
          deno test --no-lock --no-prompt --deny-net --deny-run
          --allow-env=SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SOCIAL_DB_SCHEMA,SOCIAL_STATE_SECRET,APP_URL,CORS_ALLOWED_ORIGIN,ZERNIO_API_KEY,ZERNIO_BASE_URL,CRON_SECRET
          --config tests/social-connection/deno.json
          tests/social-connection/handler-sdk.test.ts
          tests/social-management/handler-sdk.test.ts
          tests/social-publish/runtime.test.ts
      - run: npm run test:billing
      - name: Stripe reconciliation with the real provider SDK
        run: >-
          deno test --no-lock --no-prompt --deny-net --deny-run
          --node-modules-dir=none
          --allow-env=STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_ANON_KEY,PURAMA_BILLING_ORIGIN
          --config tests/revenue/deno.json tests/revenue/webhook.test.ts
      - run: npm run test:founder
      - run: npm run test:founder:types
      - run: npm run build
      - run: npx tsc --noEmit -p tsconfig.app.json
      - name: Prepare the locked Playwright image without Ubuntu downloads
        run: bash scripts/ci/run-site-browser.sh --prepare
      - name: Social browser behavior
        # Packaged Chrome keeps its existing AppArmor profile and browser sandbox.
        env:
          SOCIAL_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
        run: node tests/social-browser/run.mjs
      - run: npx tsc --noEmit -p tests/public/tsconfig.json
      - run: npm run typecheck:distribution
      - run: bash scripts/ci/run-site-browser.sh npm run test:distribution:browser
      - run: bash scripts/ci/run-site-browser.sh npm run test:public
      - run: bash scripts/ci/run-site-browser.sh npm run test:chat
      - run: bash scripts/ci/run-site-browser.sh npm run test:quality
      - run: bash scripts/ci/run-site-browser.sh npm run test:oauth:browser
      - run: bash scripts/ci/run-site-browser.sh npm run test:founder:browser
      - run: bash scripts/ci/run-site-browser.sh npm run test:account-isolation
      - run: bash scripts/ci/run-site-browser.sh npm run test:contracts-ots:browser
      - run: bash scripts/ci/run-site-browser.sh npm run test:wellbeing
      - run: bash scripts/ci/run-site-browser.sh npm run test:voice-consent
      - run: bash scripts/ci/run-site-browser.sh npm run test:ui-state
      - run: bash scripts/ci/run-site-browser.sh npm run test:async-ui
      - run: bash scripts/ci/run-site-browser.sh npm run test:mobile-auth
      - name: Archive voice consent and accessibility browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iao-voice-accessibility-${{ github.sha }}
          path: test-results/voice-consent
          retention-days: 14
      - if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        run: npm audit --audit-level=high --omit=dev

  subscription-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: karta
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-trial-fixture-only
          PGDATA: /var/lib/postgresql/purama-trial-data
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PURAMA_TRIAL_TEST_PG_HOST: 127.0.0.1
      PURAMA_TRIAL_TEST_PG_PORT: 5432
      PURAMA_TRIAL_TEST_PG_USER: postgres
      PURAMA_TRIAL_TEST_PG_PASSWORD: local-trial-fixture-only
      PURAMA_TRIAL_TEST_PG_DATA: /var/lib/postgresql/purama-trial-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: karta/package-lock.json
      - run: npm ci --no-audit
      - run: npm run test:subscriptions:postgres
      - name: Private tool result concurrency on native PostgreSQL
        run: node --test test/privateToolResults.native.mjs
