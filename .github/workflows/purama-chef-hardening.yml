name: PURAMA CHEF hardening

on:
  push:
    branches:
      - main
      - codex/purama-chef-hardening-20260927
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purama-chef-${{ github.ref }}
  cancel-in-progress: true

jobs:
  karta:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: karta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: karta/package-lock.json
      - run: npm ci --no-audit
      - run: node ../scripts/generate-supabase-contracts.mjs --check
      - run: npm test
      - run: node --test ../tests/oauth-google/state-sql.test.mjs
      - name: OAuth state on native PostgreSQL
        working-directory: .
        run: >-
          bash qa/reliability-audit-20261110/oauth-native/run-native.sh
          --migration supabase/migrations/20261110233000_oauth_connection_states.sql
          --helper supabase/functions/_shared/oauth-state.ts
          --fixture-root "$RUNNER_TEMP/purama-oauth-native-clusters"
          --output "$RUNNER_TEMP/purama-oauth-native-results"
      - name: Preserve native OAuth evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oauth-native-results
          path: ${{ runner.temp }}/purama-oauth-native-results
      - run: npm run typecheck
      - run: npm run build
      - if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        run: npm audit --audit-level=high --omit=dev

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm ci --no-audit
      - run: npm run test:dependencies
      - run: npm run lint
      - run: npm run test:distribution:unit
      - run: npm run test:distribution:sql
      - run: npm run test:distribution:worker
      - run: npm run test:distribution:chat
      - run: npm run test:contracts-auth
      - run: npm run test:cross-app-jwt
      - run: npm run test:voice-settings
      - run: npm run test:contracts-security
      - run: npm run test:contracts-ots
      - run: npm run test:contracts-native
      - run: npm run test:oauth
      - run: deno check --no-config --no-lock --node-modules-dir=manual supabase/functions/contracts-ots-stamp/index.ts supabase/functions/contracts-ots-verify/index.ts supabase/functions/contracts-webhook/index.ts supabase/functions/check-subscription/index.ts supabase/functions/process-influencer-payments/index.ts supabase/functions/founder-dashboard/index.ts supabase/functions/agent-chat/index.ts supabase/functions/creator-agent-chat/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/oauth-google/index.ts supabase/functions/email-agent-gmail-oauth/index.ts
      - run: npm run test:commerce:plans
      - run: npm run test:commerce:handlers
      - run: npm run test:founder
      - run: npm run test:founder:types
      - run: npm run build
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx playwright install --with-deps chromium webkit
      - run: npx tsc --noEmit -p tests/public/tsconfig.json
      - run: npm run typecheck:distribution
      - run: npm run test:distribution:browser
      - run: npm run test:public
      - run: npm run test:chat
      - run: npm run test:quality
      - run: npm run test:oauth:browser
      - run: npm run test:founder:browser
      - run: npm run test:account-isolation
      - run: npm run test:contracts-ots:browser
      - run: npm run test:wellbeing
      - run: npm run test:voice-consent
      - run: npm run test:ui-state
      - run: npm run test:async-ui
      - run: npm run test:mobile-auth
      - if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        run: npm audit --audit-level=high --omit=dev
