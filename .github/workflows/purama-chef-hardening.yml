name: PURAMA CHEF hardening

on:
  push:
    branches:
      - codex/purama-chef-hardening-20260927
  pull_request:

permissions:
  contents: read

concurrency:
  group: purama-chef-${{ github.ref }}
  cancel-in-progress: true

jobs:
  karta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: karta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: karta/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Serialize PostgreSQL/WASM fixtures; retain the existing assertions and timeouts.
      - run: npm test -- --maxWorkers=1
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://purama-ci.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.7
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Database contracts are generated from PGlite; its pinned dependency lives in KARTA.
      - run: npm ci --prefix karta --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:database-contracts
      - run: npm run test:commerce:plans
      - run: npm run test:commerce:handlers
      - run: npm run test:founder
      - run: npm run test:founder:types
      - run: npm run test:contracts-ots
      - run: deno check --no-config supabase/functions/founder-dashboard/index.ts
      - run: deno check --no-config --no-lock supabase/functions/contracts-ots-stamp/index.ts supabase/functions/contracts-ots-verify/index.ts supabase/functions/contracts-webhook/index.ts
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:quality
      - run: npm run test:founder:browser
      - name: Verify account isolation
        run: npm run test:account-isolation
        env:
          ACCOUNT_ISOLATION_EVIDENCE: ${{ runner.temp }}/iao-account-isolation
      - name: Verify mounted contract proof flows
        run: npm run test:contracts-ots:browser
        env:
          CONTRACTS_OTS_BROWSER_EVIDENCE: ${{ runner.temp }}/iao-contracts-ots-browser
      - run: npm audit --audit-level=high --omit=dev
