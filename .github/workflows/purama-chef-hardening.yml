name: PURAMA CHEF hardening

on:
  push:
    branches:
      - codex/purama-chef-hardening-20260927
  pull_request:

permissions:
  contents: read

concurrency:
  group: purama-chef-${{ github.ref }}
  cancel-in-progress: true

jobs:
  karta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: karta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: karta/package-lock.json
      - run: npm ci --no-audit
      - run: node ../scripts/generate-supabase-contracts.mjs --check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        run: npm audit --audit-level=high --omit=dev

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm run test:dependencies
      - run: npm run build
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:quality
      - if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        run: npm audit --audit-level=high --omit=dev

  subscription-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: karta
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-trial-fixture-only
          PGDATA: /var/lib/postgresql/purama-trial-data
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PURAMA_TRIAL_TEST_PG_HOST: 127.0.0.1
      PURAMA_TRIAL_TEST_PG_PORT: 5432
      PURAMA_TRIAL_TEST_PG_USER: postgres
      PURAMA_TRIAL_TEST_PG_PASSWORD: local-trial-fixture-only
      PURAMA_TRIAL_TEST_PG_DATA: /var/lib/postgresql/purama-trial-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: karta/package-lock.json
      - run: npm ci --no-audit
      - run: npm run test:subscriptions:postgres
