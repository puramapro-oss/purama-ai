name: PURAMA CHEF hardening

on:
  push:
    branches:
      - main
      - codex/purama-chef-hardening-20260927
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purama-chef-${{ github.ref }}
  cancel-in-progress: true

jobs:
  karta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: karta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: karta/package-lock.json
      - run: npm ci --no-audit
      - run: node ../scripts/generate-supabase-contracts.mjs --check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Promotion SQL invariants
        working-directory: .
        env:
          PGLITE_MODULE: ${{ github.workspace }}/karta/node_modules/@electric-sql/pglite/dist/index.js
        run: >-
          node --test --test-concurrency=1
          tests/revenue/inbox-sql.test.mjs
          tests/social-publish/migration-sql.test.mjs
          tests/social-connection/binding-sql.test.mjs
      - if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        run: npm audit --audit-level=high --omit=dev

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm ci --no-audit
      - run: npm run test:dependencies
      - run: npm run lint
      - run: npm run test:contracts-auth
      - run: npm run test:cross-app-jwt
      - run: npm run test:contracts-security
      - run: npm run test:contracts-ots
      - run: npm run test:contracts-native
      - run: deno check --no-config --no-lock --node-modules-dir=manual supabase/functions/contracts-ots-stamp/index.ts supabase/functions/contracts-ots-verify/index.ts supabase/functions/contracts-webhook/index.ts supabase/functions/check-subscription/index.ts supabase/functions/process-influencer-payments/index.ts supabase/functions/founder-dashboard/index.ts supabase/functions/agent-chat/index.ts
      - run: npm run test:commerce:plans
      - run: npm run test:commerce:handlers
      - name: Promotion core behavior
        run: >-
          deno test --no-config --no-lock --no-prompt --deny-net --deny-run
          tests/social-publish/client-intent.test.ts
          tests/social-publish/provider.test.ts
          tests/social-publish/publish.test.ts
          tests/social-publish/scheduled.test.ts
          tests/social-connection/connection.test.ts
          tests/social-management/handlers.test.ts
      - name: Promotion routes with the real Supabase SDK
        run: >-
          deno test --no-lock --no-prompt --deny-net --deny-run
          --allow-env=SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SOCIAL_DB_SCHEMA,SOCIAL_STATE_SECRET,APP_URL,CORS_ALLOWED_ORIGIN,ZERNIO_API_KEY,ZERNIO_BASE_URL,CRON_SECRET
          --config tests/social-connection/deno.json
          tests/social-connection/handler-sdk.test.ts
          tests/social-management/handler-sdk.test.ts
          tests/social-publish/runtime.test.ts
      - name: Promotion revenue with the real Stripe SDK
        run: >-
          deno test --no-lock --no-prompt --deny-net --deny-run
          --node-modules-dir=none
          --allow-env=STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_ANON_KEY
          --config tests/revenue/deno.json
          tests/revenue/webhook.test.ts
      - run: npm run test:founder
      - run: npm run test:founder:types
      - run: npm run build
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx playwright install --with-deps chromium
      - name: Promotion browser behavior
        run: node tests/social-browser/run.mjs
      - run: npx tsc --noEmit -p tests/public/tsconfig.json
      - run: npm run test:public
      - run: npm run test:chat
      - run: npm run test:quality
      - run: npm run test:founder:browser
      - run: npm run test:account-isolation
      - run: npm run test:contracts-ots:browser
      - run: npm run test:wellbeing
      - run: npm run test:voice-consent
      - run: npm run test:ui-state
      - run: npm run test:async-ui
      - run: npm run test:mobile-auth
      - if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        run: npm audit --audit-level=high --omit=dev
