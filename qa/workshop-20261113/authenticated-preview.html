<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Atelier PURAMA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #f4f2ec;
      color: #242e2a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main { width: 100%; max-width: 480px; }
    .brand { margin: 0 0 36px; font-size: .8rem; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 0 0 12px; font-size: 2rem; line-height: 1.2; letter-spacing: -.035em; }
    .intro { margin: 0; color: #526057; max-width: 38ch; }
    .counter-area { margin: 32px 0 24px; padding: 24px 0; border-block: 1px solid #b9c2b9; }
    .label { display: block; font-size: .9rem; color: #526057; }
    #counter { display: block; margin-top: 4px; font-size: 4rem; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    button { width: 100%; min-height: 52px; padding: 14px 18px; border: 2px solid transparent; border-radius: 8px; background: #28533f; color: #fafbf7; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #1d4030; }
    button:active { background: #153324; }
    button:focus-visible { outline: 3px solid #28533f; outline-offset: 4px; }
    .hint { margin: 16px 0 0; font-size: .875rem; color: #526057; }
    @media (max-width: 360px) { body { padding: 20px; } h1 { font-size: 1.75rem; } }
    @media (forced-colors: active) { button { border-color: ButtonText; } }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <p class="brand">PURAMA</p>
    <h1 id="title">Atelier PURAMA</h1>
    <p class="intro">Une unité à la fois. Ajoutez la suivante en un geste.</p>
    <div class="counter-area">
      <span class="label" id="counter-label">Unités ajoutées</span>
      <output id="counter" aria-labelledby="counter-label" aria-live="polite" aria-atomic="true">0</output>
    </div>
    <button type="button" id="add-unit">Ajouter une unité</button>
    <p class="hint">Au clavier : Tab pour sélectionner le bouton, puis Entrée ou Espace pour ajouter.</p>
    <noscript><p>Activez JavaScript pour utiliser le compteur.</p></noscript>
  </main>
  <script>
    const counter = document.getElementById('counter');
    const addUnit = document.getElementById('add-unit');
    let count = 0n;
    addUnit.addEventListener('click', () => {
      count += 1n;
      counter.textContent = count.toString();
    });
  </script>
</body>
</html>
