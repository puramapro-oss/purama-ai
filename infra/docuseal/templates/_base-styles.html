<!-- Base CSS for all Purama contracts — shared header/footer -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11pt; line-height: 1.5; color: #111; padding: 40px 48px; max-width: 210mm; }
  .logo-band { border-bottom: 2px solid #7C3AED; padding-bottom: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 18pt; font-weight: 700; color: #7C3AED; letter-spacing: 0.5px; }
  .logo-sub { font-size: 9pt; color: #666; }
  h1 { font-size: 16pt; margin: 24px 0 8px; color: #111; }
  h2 { font-size: 13pt; margin: 20px 0 6px; color: #7C3AED; font-weight: 600; }
  h3 { font-size: 11.5pt; margin: 14px 0 4px; color: #333; font-weight: 600; }
  p { margin: 8px 0; text-align: justify; }
  ul { margin: 8px 0 8px 24px; }
  li { margin: 4px 0; }
  strong { color: #000; }
  .preamble { background: #F5F3FF; padding: 12px 16px; border-left: 3px solid #7C3AED; margin: 16px 0; font-size: 10pt; }
  .party-box { border: 1px solid #DDD; padding: 12px; margin: 8px 0; border-radius: 4px; }
  .party-box strong { display: block; margin-bottom: 4px; }
  .sig-block { margin-top: 40px; display: flex; justify-content: space-between; gap: 40px; }
  .sig-col { flex: 1; border-top: 1px solid #999; padding-top: 8px; font-size: 10pt; }
  .sig-col strong { display: block; font-size: 11pt; margin-bottom: 4px; }
  .footer { margin-top: 48px; padding-top: 12px; border-top: 1px solid #EEE; font-size: 8.5pt; color: #666; line-height: 1.4; text-align: center; }
  .legal-mentions { font-size: 9pt; color: #555; margin-top: 24px; padding: 12px; background: #FAFAFA; border-radius: 4px; line-height: 1.4; }
  .page-break { page-break-before: always; }
  table.numbers { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 10pt; }
  table.numbers td { border: 1px solid #DDD; padding: 6px 10px; }
  table.numbers td.label { background: #FAFAFA; font-weight: 600; width: 40%; }
</style>
