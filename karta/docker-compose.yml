services:
  karta-redis:
    image: redis:7-alpine
    container_name: karta-redis
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--port", "6380", "--save", "60", "1"]
    volumes:
      - karta-redis-data:/data

  karta-engine:
    build: .
    container_name: karta-engine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - karta-redis
    # Exceeds the maximum application shutdown deadline (120s).
    stop_grace_period: 130s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.KARTA_PORT||4100)+'/health',{signal:AbortSignal.timeout(35000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 40s
      start_period: 30s
      retries: 3
    env_file:
      - .env

volumes:
  karta-redis-data:
