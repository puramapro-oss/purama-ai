name: OTA Update — Purama AI Mobile

on:
  push:
    tags:
      - "ota-*"

concurrency:
  group: ota-update
  cancel-in-progress: true

jobs:
  ota:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        run: eas update --branch production --message "OTA ${{ github.ref_name }}" --non-interactive
