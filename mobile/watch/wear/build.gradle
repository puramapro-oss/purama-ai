apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'dev.purama.accessibilitywatch'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    applicationId 'dev.purama.purama_ai'
    minSdk 26
    targetSdk rootProject.ext.targetSdkVersion
    versionCode 1
    versionName '1.0.0'
  }
  signingConfigs {
    debug {
      // Data Layer requires the phone and watch to have the same signing key.
      // Reuse Expo's generated phone debug key, never a second watch debug key.
      storeFile new File(rootProject.projectDir, 'app/debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }
  buildTypes { debug { signingConfig signingConfigs.debug } }
  sourceSets {
    main.java.srcDirs += '../../modules/purama-accessibility-watch/android/src/main/java'
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
}
kotlin.sourceSets.getByName('main').kotlin.exclude('**/PuramaAccessibilityWatchModule.kt')
dependencies { implementation 'com.google.android.gms:play-services-wearable:20.0.1' }
